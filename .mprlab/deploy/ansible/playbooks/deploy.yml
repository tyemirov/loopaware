---
- name: Validate the exact LoopAware deployment inputs locally
  hosts: localhost
  connection: local
  gather_facts: false
  any_errors_fatal: true
  vars:
    mprlab_app_resource_repo_path: "{{ lookup('ansible.builtin.env', 'LOOPAWARE_DEPLOY_REPO_ROOT') }}"
    mprlab_app_resource_source_repo_path: "{{ lookup('ansible.builtin.env', 'LOOPAWARE_DEPLOY_REPO_ROOT') }}"
  tasks:
    - name: Run the app-owned validation entrypoint
      ansible.builtin.include_tasks: ../tasks/validate.yml

- name: Deploy the exact LoopAware backend release
  hosts: gateway
  gather_facts: false
  become: true
  any_errors_fatal: true
  vars:
    mprlab_app_resource_repo_path: "{{ lookup('ansible.builtin.env', 'LOOPAWARE_DEPLOY_REPO_ROOT') }}"
    mprlab_app_resource_source_repo_path: "{{ lookup('ansible.builtin.env', 'LOOPAWARE_DEPLOY_REPO_ROOT') }}"
  tasks:
    - name: Run the app-owned preflight entrypoint
      ansible.builtin.include_tasks: ../tasks/preflight.yml
    - name: Run the app-owned deploy entrypoint
      ansible.builtin.include_tasks: ../tasks/deploy.yml
    - name: Run the app-owned verify entrypoint
      ansible.builtin.include_tasks: ../tasks/verify.yml

- name: Verify the public LoopAware backend route
  hosts: localhost
  connection: local
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Require the deployed backend health response
      ansible.builtin.uri:
        url: https://loopaware-api.mprlab.com/healthz
        method: GET
        follow_redirects: none
        status_code: 200
        return_content: true
        timeout: 10
      register: loopaware_public_health
      retries: 12
      delay: 5
      until: loopaware_public_health is succeeded and loopaware_public_health.json.status == 'ok'
