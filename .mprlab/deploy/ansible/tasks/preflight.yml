---
- name: Load the immutable LoopAware deployment image contract
  ansible.builtin.include_tasks: resolve-image.yml

- name: Require the LoopAware gateway inventory contract
  ansible.builtin.assert:
    quiet: true
    that:
      - loopaware_remote_project_root is match('^/\\S+$')
      - loopaware_docker_cli is match('^/\\S+$')
      - loopaware_compose_project_name == 'mprlab-nginx-gateway'
      - loopaware_gateway_network == 'mprlab-nginx-gateway_default'
      - loopaware_data_volume == 'mprlab-nginx-gateway_loopaware-data'
      - loopaware_shared_tauth_env_path is match('^/\\S+$')
      - loopaware_shared_pinguin_env_path is match('^/\\S+$')
    fail_msg: "Gateway inventory must declare the canonical LoopAware project root, Docker CLI, Compose project, network, and data volume."

- name: Gather gateway capacity facts
  ansible.builtin.setup:
    gather_subset:
      - '!all'
      - hardware

- name: Require the production gateway architecture
  ansible.builtin.assert:
    quiet: true
    that:
      - ansible_architecture == 'x86_64'
    fail_msg: "LoopAware deployment requires x86_64; detected {{ ansible_architecture }}."

- name: Measure available gateway memory
  ansible.builtin.command:
    argv:
      - awk
      - '$1 == "MemAvailable:" && $2 ~ /^[0-9]+$/ && $3 == "kB" { print int($2 / 1024); found = 1 } END { if (!found) exit 1 }'
      - /proc/meminfo
  register: loopaware_available_memory_mb
  changed_when: false

- name: Require available gateway memory
  ansible.builtin.assert:
    quiet: true
    that:
      - (loopaware_available_memory_mb.stdout | int) >= 512
    fail_msg: "LoopAware deployment requires at least 512 MiB available memory; detected {{ loopaware_available_memory_mb.stdout }} MiB."

- name: Measure available deployment disk bytes
  ansible.builtin.shell:
    cmd: "set -o pipefail; df -Pk {{ loopaware_remote_project_root | dirname | quote }} | awk 'NR == 2 { print $4 * 1024 }'"
    executable: /bin/bash
  register: loopaware_available_disk_bytes
  changed_when: false

- name: Require deployment disk capacity
  ansible.builtin.assert:
    quiet: true
    that:
      - (loopaware_available_disk_bytes.stdout | int) >= 2147483648
    fail_msg: "LoopAware deployment requires at least 2 GiB available disk space."

- name: Require the production Docker engine
  ansible.builtin.command:
    argv:
      - "{{ loopaware_docker_cli }}"
      - version
  changed_when: false

- name: Inspect the shared gateway network
  ansible.builtin.command:
    argv:
      - "{{ loopaware_docker_cli }}"
      - network
      - inspect
      - "{{ loopaware_gateway_network }}"
  changed_when: false

- name: Inspect the persistent LoopAware data volume
  ansible.builtin.command:
    argv:
      - "{{ loopaware_docker_cli }}"
      - volume
      - inspect
      - "{{ loopaware_data_volume }}"
  changed_when: false

- name: Inspect required gateway dependency containers
  ansible.builtin.command:
    argv:
      - "{{ loopaware_docker_cli }}"
      - inspect
      - caddy2
      - pinguin-api
  register: loopaware_dependency_inspect
  changed_when: false

- name: Require running dependencies on the shared gateway network
  ansible.builtin.assert:
    quiet: true
    that:
      - item.State.Running
      - loopaware_gateway_network in item.NetworkSettings.Networks
    fail_msg: "Required dependency {{ item.Name }} must be running on {{ loopaware_gateway_network }}."
  loop: "{{ loopaware_dependency_inspect.stdout | from_json }}"
  loop_control:
    label: "{{ item.Name }}"

- name: Read the active shared dependency environments
  ansible.builtin.slurp:
    src: "{{ item }}"
  loop:
    - "{{ loopaware_shared_tauth_env_path }}"
    - "{{ loopaware_shared_pinguin_env_path }}"
  register: loopaware_shared_dependency_environments
  no_log: true

- name: Verify LoopAware, TAuth, and Pinguin identities and authenticated canaries
  delegate_to: localhost
  become: false
  ansible.builtin.command:
    argv:
      - python3
      - "{{ mprlab_app_resource_repo_path }}/scripts/verify-loopaware-dependency-contract.py"
    stdin: >-
      {{
        {
          'loopaware': lookup('ansible.builtin.file', mprlab_app_resource_source_repo_path ~ '/configs/.env.loopaware'),
          'tauth': loopaware_shared_dependency_environments.results[0].content | b64decode,
          'pinguin': loopaware_shared_dependency_environments.results[1].content | b64decode
        }
        | to_json
      }}
  changed_when: false
  no_log: true
