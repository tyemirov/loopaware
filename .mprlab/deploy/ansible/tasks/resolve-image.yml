---
- name: Resolve the immutable LoopAware deployment image
  ansible.builtin.set_fact:
    loopaware_deploy_image_ref_effective: "{{ lookup('ansible.builtin.env', 'LOOPAWARE_DEPLOY_IMAGE_REF') | trim }}"

- name: Require the canonical immutable LoopAware deployment image
  ansible.builtin.assert:
    quiet: true
    that:
      - loopaware_deploy_image_ref_effective is match('^ghcr[.]io/tyemirov/loopaware@sha256:[0-9a-f]{64}$')
    fail_msg: "LOOPAWARE_DEPLOY_IMAGE_REF must be the canonical immutable LoopAware GHCR digest."
