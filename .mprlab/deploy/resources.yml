mprlab_resources:
    artifacts:
        container_images:
            - build:
                context: .
                dockerfile: Dockerfile
                platforms:
                    - linux/amd64
              id: backend-image
        mobile:
            - android:
                package_name: com.mprlab.loopaware
              build:
                android: mobile/scripts/build-store-artifact.mjs
                ios: mobile/scripts/build-store-artifact.mjs
              build_system: local
              id: mobile
              ios:
                bundle_identifier: com.mprlab.loopaware
                export_intent: internal-only
              source: mobile/prepared
        npm_packages:
            - id: react-native-client
              package: '@loopaware/react-native'
              source: clients/react-native
        web_bundles:
            - format: directory
              id: website
              source:
                kind: directory
                path: web
    environment:
        private_inputs:
            - id: app-store-connect-api-issuer-id
              variable: APP_STORE_CONNECT_API_ISSUER_ID
            - id: app-store-connect-api-key-id
              variable: APP_STORE_CONNECT_API_KEY_ID
            - id: app-store-connect-api-key-path
              variable: APP_STORE_CONNECT_API_KEY_PATH
            - id: deploy-sudo-password-tutosh
              variable: DEPLOY_SUDO_PASSWORD_TUTOSH
            - id: google-play-service-account-key-path
              variable: GOOGLE_PLAY_SERVICE_ACCOUNT_KEY_PATH
            - id: loopaware-android-keystore
              variable: LOOPAWARE_ANDROID_KEYSTORE
            - id: loopaware-android-key-alias
              variable: LOOPAWARE_ANDROID_KEY_ALIAS
            - id: loopaware-android-key-password
              variable: LOOPAWARE_ANDROID_KEY_PASSWORD
            - id: loopaware-android-store-password
              variable: LOOPAWARE_ANDROID_STORE_PASSWORD
            - id: loopaware-apple-certificate-base64
              variable: LOOPAWARE_APPLE_CERTIFICATE_BASE64
            - id: loopaware-apple-certificate-password
              variable: LOOPAWARE_APPLE_CERTIFICATE_PASSWORD
            - id: loopaware-apple-identity
              variable: LOOPAWARE_APPLE_IDENTITY
            - id: loopaware-apple-profile
              variable: LOOPAWARE_APPLE_PROFILE
            - id: loopaware-apple-team
              variable: LOOPAWARE_APPLE_TEAM
            - id: mprlab-tauth-management-url
              variable: MPRLAB_TAUTH_MANAGEMENT_URL
            - id: mprlab-tauth-provisioning-credentials
              variable: MPRLAB_TAUTH_PROVISIONING_CREDENTIALS
            - id: npm-api-key
              variable: NPM_API_KEY
            - id: pinguin-auth-token
              variable: PINGUIN_AUTH_TOKEN
            - id: session-secret
              variable: SESSION_SECRET
            - id: tauth-tenant-google-android-client-id-loopaware
              variable: TAUTH_TENANT_GOOGLE_ANDROID_CLIENT_ID_LOOPAWARE
            - id: tauth-tenant-google-ios-client-id-loopaware
              variable: TAUTH_TENANT_GOOGLE_IOS_CLIENT_ID_LOOPAWARE
            - id: tauth-tenant-google-web-client-id-loopaware
              variable: TAUTH_TENANT_GOOGLE_WEB_CLIENT_ID_LOOPAWARE
            - id: tauth-tenant-jwt-signing-key-loopaware
              variable: TAUTH_TENANT_JWT_SIGNING_KEY_LOOPAWARE
        source: .mprlab/deploy/.env
    lifecycle:
        ci:
            command:
                - make
                - ci
            enabled: true
        defaults:
            timeouts:
                completion: 2m
                readiness: 30s
                request: 15s
                shutdown: 5s
                startup: 30s
        observations:
            http:
                - expected_status: 200
                  id: public-health
                  protocol: http
                  url: https://loopaware-api.mprlab.com/healthz
                - expected_status: 200
                  id: website-health
                  protocol: http
                  url: https://loopaware.mprlab.com/healthz
        operations:
            - name: app-deploy
              polling:
                attempt_limit: 4
                increment: 1s
                initial: 2s
                maximum: 10s
                multiplier: 2
              timeouts:
                completion: 5h30m
            - name: app-plan-deploy
              polling:
                attempt_limit: 4
                increment: 1s
                initial: 2s
                maximum: 10s
                multiplier: 2
              timeouts:
                completion: 2m
            - name: app-plan-publish
              polling:
                attempt_limit: 4
                increment: 1s
                initial: 2s
                maximum: 10s
                multiplier: 2
              timeouts:
                completion: 2m
            - name: app-plan-release
              polling:
                attempt_limit: 4
                increment: 1s
                initial: 2s
                maximum: 10s
                multiplier: 2
              timeouts:
                completion: 2m
            - name: app-publish
              polling:
                attempt_limit: 4
                increment: 1s
                initial: 2s
                maximum: 10s
                multiplier: 2
              timeouts:
                completion: 4h
            - name: app-release
              polling:
                attempt_limit: 4
                increment: 1s
                initial: 2s
                maximum: 10s
                multiplier: 2
              timeouts:
                completion: 30m
            - name: app_deploy.health.same_host
              polling:
                attempt_limit: 3
                increment: 0s
                initial: 15s
                maximum: 30s
                multiplier: 2
            - name: app_deploy.pages.deployment_status_poll
              polling:
                attempt_limit: 120
                increment: 0s
                initial: 1s
                maximum: 10s
                multiplier: 2
            - name: app_lifecycle.repository_read
              polling:
                attempt_limit: 60
                increment: 2s
                initial: 2s
                maximum: 15s
                multiplier: 2
            - name: app_publish.npm.archive_read
              polling:
                attempt_limit: 1443
                increment: 1s
                initial: 2s
                maximum: 10s
                multiplier: 2
            - name: app_publish.npm.version_verify
              polling:
                attempt_limit: 1443
                increment: 1s
                initial: 2s
                maximum: 10s
                multiplier: 2
            - name: ci
              timeouts:
                completion: 30m
            - name: deployment.http-health
              polling:
                attempt_limit: 3
                increment: 0s
                initial: 1s
                maximum: 1s
                multiplier: 1
            - name: deployment.resource.recovery
              polling:
                attempt_limit: 3
                increment: 0s
                initial: 1s
                maximum: 1s
                multiplier: 1
            - name: mobile.publication
              polling:
                attempt_limit: 120
                increment: 0s
                initial: 1s
                maximum: 30s
                multiplier: 2
            - name: mobile.publication.google
              polling:
                attempt_limit: 12
                increment: 0s
                initial: 1s
                maximum: 30s
                multiplier: 2
        private_inputs:
            operations: []
    owner: loopaware
    publications:
        app_store_connect:
            ios:
                - app_store_id: "6788555440"
                  artifact:
                    id: mobile
                    platform: ios
                  destination: testflight
                  id: mobile-ios
                  track: internal
        ghcr:
            images:
                - artifact: backend-image
                  id: backend-image
                  repository: ghcr.io/tyemirov/loopaware
        github_pages:
            sites:
                - artifact: website
                  branch: gh-pages
                  domain: loopaware.mprlab.com
                  id: website
                  marker:
                    path: /.mprlab-release.json
                  repository: tyemirov/loopaware
        google_play:
            applications:
                - artifact:
                    id: mobile
                    platform: android
                  destination: google_play
                  id: mobile-android
                  track: internal
        npm:
            packages:
                - access: public
                  artifact: react-native-client
                  id: react-native-client
                  registry: https://registry.npmjs.org/
                  tag: latest
    release:
        scheme: semver
    targets:
        access:
            hosts:
                - elevation_password:
                    input: deploy-sudo-password-tutosh
                  host: tutosh
        docker_compose:
            projects:
                - id: runtime
                  retired_services:
                    - project: mprlab-nginx-gateway
                      service: loopaware-api
                  services:
                    - assets:
                        - mode: "0444"
                          source: configs/config.loopaware.yml
                          target: /app/configs/config.loopaware.yml
                      endpoints:
                        - endpoint:
                            alias: loopaware-api
                            port: 8080
                            scheme: http
                            scope: same_host
                          health:
                            expected_status: 200
                            path: /healthz
                            protocol: http
                          id: http
                          name: loopaware.http
                          version: 1
                        - endpoint:
                            alias: runtime-loopaware-api-readiness
                            port: 8080
                            scheme: http
                            scope: same_host
                          health:
                            expected_status: 200
                            path: /healthz
                            protocol: http
                          id: readiness
                          name: loopaware.readiness.runtime.loopaware-api
                          version: 1
                      environment:
                        - name: APP_ADDR
                          value: :8080
                        - name: DB_DRIVER
                          value: sqlite
                        - name: DB_DSN
                          value: file:/app/data/loopaware.sqlite?_foreign_keys=on
                        - capability: pinguin.grpc
                          component: address
                          name: PINGUIN_ADDR
                        - input: pinguin-auth-token
                          name: PINGUIN_AUTH_TOKEN
                        - name: PINGUIN_TENANT_ID
                          value: loopaware
                        - name: PUBLIC_BASE_URL
                          output: origin
                          target: website
                        - input: session-secret
                          name: SESSION_SECRET
                        - capability: tauth.http
                          component: url
                          name: TAUTH_BASE_URL
                        - input: tauth-tenant-jwt-signing-key-loopaware
                          name: TAUTH_JWT_SIGNING_KEY
                        - name: TAUTH_SESSION_COOKIE_NAME
                          value: app_session_loopaware
                        - name: TAUTH_TENANT_ID
                          value: loopaware
                        - name: TRUSTED_PROXY_CIDR
                          value: 172.19.0.0/16
                      id: loopaware-api
                      image:
                        publication: backend-image
                      mounts:
                        - read_only: false
                          target: /app/data
                          volume: data
                      placement:
                        cardinality: one
                        group: gateway
                      ports:
                        - container_port: 8080
                      readiness:
                        endpoint: readiness
                  volumes:
                    - id: data
                      name: mprlab-nginx-gateway_loopaware-data
                      retention: retain
        github_pages:
            sites:
                - id: website
                  publication: website
                  url: https://loopaware.mprlab.com/
        ingress:
            caddy:
                routes:
                    - access:
                        rate_limit:
                            events: 300
                            window_seconds: 10
                        trusted_networks:
                            - 127.0.0.1/32
                            - 172.19.0.0/16
                            - 192.168.1.158/32
                      handlers:
                        - id: default
                          path_prefix: /
                          transport:
                            dial_timeout_seconds: 10
                            protocol: http
                            read_timeout_seconds: 80
                            response_header_timeout_seconds: 30
                          upstream: loopaware.http
                      hostname: loopaware-api.mprlab.com
                      id: loopaware-api-ingress
                      operations:
                        - name: app-deploy
                          polling:
                            attempt_limit: 200
                            increment: 1s
                            initial: 1s
                            maximum: 10s
                            multiplier: 2
                          timeouts:
                            completion: 30m
                            readiness: 5m
                            request: 30s
                            shutdown: 30s
                            startup: 1m
                      listener: https
                      tls:
                        mode: automatic
