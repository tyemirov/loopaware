---
mprlab_resources:
  owner: loopaware
  release:
    scheme: semver
  resources:
    - kind: private_values
      id: private
      bindings:
        google-native-android-client-id: TAUTH_TENANT_GOOGLE_ANDROID_CLIENT_ID_LOOPAWARE
        google-native-ios-client-id: TAUTH_TENANT_GOOGLE_IOS_CLIENT_ID_LOOPAWARE
        google-web-client-id: TAUTH_TENANT_GOOGLE_WEB_CLIENT_ID_LOOPAWARE
        pinguin-auth-token: PINGUIN_AUTH_TOKEN
        session-secret: SESSION_SECRET
        tauth-jwt-signing-key: TAUTH_TENANT_JWT_SIGNING_KEY_LOOPAWARE
    - kind: compose_project
      id: runtime
      retired_services:
        - project: mprlab-nginx-gateway
          service: loopaware-api
      images:
        - id: backend-image
          repository: ghcr.io/tyemirov/loopaware
          build:
            context: .
            dockerfile: Dockerfile
            platforms:
              - linux/amd64
      services:
        - id: loopaware-api
          image: backend-image
          placement:
            group: gateway
            cardinality: one
          environment:
            APP_ADDR:
              value: ":8080"
            DB_DRIVER:
              value: sqlite
            DB_DSN:
              value: file:/app/data/loopaware.sqlite?_foreign_keys=on
            PINGUIN_ADDR:
              capability: pinguin.grpc
              component: address
            PINGUIN_AUTH_TOKEN:
              resource: private
              output: pinguin-auth-token
            PINGUIN_TENANT_ID:
              value: loopaware
            PUBLIC_BASE_URL:
              resource: website
              output: origin
            SESSION_SECRET:
              resource: private
              output: session-secret
            TAUTH_BASE_URL:
              capability: tauth.http
              component: url
            TAUTH_JWT_SIGNING_KEY:
              resource: authentication
              output: jwt-signing-key
            TAUTH_SESSION_COOKIE_NAME:
              resource: authentication
              output: session-cookie-name
            TAUTH_TENANT_ID:
              resource: authentication
              output: tenant-id
            TRUSTED_PROXY_CIDR:
              value: 172.19.0.0/16
          assets:
            - source: configs/config.loopaware.yml
              target: /app/configs/config.loopaware.yml
              mode: "0444"
          mounts:
            - volume: data
              target: /app/data
              read_only: false
          ports:
            - container_port: 8080
          readiness:
            protocol: http
            port: 8080
            path: /healthz
            expected_status: 200
      volumes:
        - id: data
          name: mprlab-nginx-gateway_loopaware-data
          retention: retain
    - kind: runtime_capability
      id: http
      name: loopaware.http
      version: 1
      project: runtime
      service: loopaware-api
      endpoint:
        scope: same_host
        scheme: http
        alias: loopaware-api
        port: 8080
      health:
        protocol: http
        path: /healthz
        expected_status: 200
    - kind: caddy_route
      id: public-api
      hostname: loopaware-api.mprlab.com
      listener: https
      handlers:
        - id: default
          path_prefix: /
          upstream: loopaware.http
          transport:
            protocol: http
            dial_timeout_seconds: 10
            response_header_timeout_seconds: 30
            read_timeout_seconds: 80
      tls:
        mode: automatic
      access:
        trusted_networks:
          - 127.0.0.1/32
          - 172.19.0.0/16
          - 192.168.1.158/32
        rate_limit:
          events: 300
          window_seconds: 10
    - kind: health_check
      id: public-health
      protocol: http
      url: https://loopaware-api.mprlab.com/healthz
      expected_status: 200
    - kind: github_pages
      id: website
      repository: tyemirov/loopaware
      branch: gh-pages
      domain: loopaware.mprlab.com
      url: https://loopaware.mprlab.com/
      source:
        kind: directory
        path: web
      verification:
        path: /.mprlab-release.json
    - kind: npm_package
      id: react-native-client
      source: clients/react-native
      package: "@loopaware/react-native"
      registry: https://registry.npmjs.org/
      access: public
      tag: latest
    - kind: mobile_application
      id: mobile
      source: mobile
      build_system: local
      build:
        android: mobile/scripts/build-android-bundle.mjs
        ios: mobile/scripts/build-ios-archive.mjs
      publish:
        android: mobile/scripts/publish-android-play.mjs
        ios: mobile/scripts/submit-ios.mjs
      ios:
        bundle_identifier: com.mprlab.loopaware
        app_store_id: "6788555440"
        destination: testflight
        track: internal
      android:
        package_name: com.mprlab.loopaware
        destination: google_play
        track: internal
    - kind: tauth_tenant
      id: authentication
      capability: tauth.tenants
      version: 1
      tenant:
        id: loopaware
        display_name: LoopAware
        origins:
          - https://loopaware.mprlab.com
        google_web_client_id:
          resource: private
          output: google-web-client-id
        google_native_clients:
          - platform: android
            client_id:
              resource: private
              output: google-native-android-client-id
            redirect_uris:
              - com.mprlab.loopaware:/oauth2redirect/google
          - platform: ios
            client_id:
              resource: private
              output: google-native-ios-client-id
            redirect_uris:
              - com.googleusercontent.apps.281540686395-8a90ldjnklddl0qpoc8ur6620lguv7mg:/oauth2redirect/google
        jwt_signing_key:
          resource: private
          output: tauth-jwt-signing-key
        cookie:
          domain: .mprlab.com
          session_name: app_session_loopaware
          refresh_name: app_refresh_loopaware
