app_name: loopaware
service_name: loopaware-api
image_repository: ghcr.io/tyemirov/loopaware
image_tag: latest
public_host: loopaware-api.mprlab.com
container_port: 8080
healthcheck_path: /api/me
gateway_target: loopaware
caddy_container_name: caddy2
caddy_config_path: /etc/caddy/Caddyfile
caddy:
  snippet_name: loopaware-api.caddy
  import_snippet: common_site
  dial_timeout: 10s
  response_header_timeout: 30s
  read_timeout: 80s
pages:
  enabled: true
  resources:
    - name: loopaware
      type: github_pages_workflow
      workflow: pages.yml
      url: https://loopaware.mprlab.com/
      run_lookup_limit: 100
