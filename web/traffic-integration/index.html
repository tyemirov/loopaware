<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Traffic Integration</title>
    <style>
      body {
        margin: 0;
        padding: 48px 24px;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, sans-serif;
        background: #fef3c7;
        color: #1f2937;
      }
      .page {
        max-width: 720px;
        margin: 0 auto;
      }
      code {
        background: rgba(120, 53, 15, 0.15);
        padding: 0.1rem 0.25rem;
        border-radius: 0.25rem;
      }
    </style>
  </head>
  <body>
    <main class="page">
      <h1>Traffic Integration</h1>
      <p>Provide <code>site_id</code> in the query string to load the pixel.</p>
      <p id="traffic-integration-status"></p>
    </main>
    <script>
      // @ts-check
      (function () {
        function getQueryParam(search, name) {
          if (!search || !name) {
            return null;
          }
          var query = search.indexOf("?") === 0 ? search.substring(1) : search;
          if (!query) {
            return null;
          }
          var pairs = query.split("&");
          for (var i = 0; i < pairs.length; i++) {
            var pair = pairs[i].split("=");
            if (decodeURIComponent(pair[0].replace(/\+/g, " ")) === name) {
              return decodeURIComponent((pair[1] || "").replace(/\+/g, " "));
            }
          }
          return null;
        }
        var search = window.location.search || "";
        var siteId = getQueryParam(search, "site_id");
        var status = document.getElementById("traffic-integration-status");
        if (!siteId) {
          if (status) {
            status.textContent = "Missing site_id query parameter.";
          }
          throw new Error("traffic_integration.init_failed: missing site_id query parameter");
        }
        siteId = siteId.trim();
        if (!siteId) {
          if (status) {
            status.textContent = "Missing site_id query parameter.";
          }
          throw new Error("traffic_integration.init_failed: empty site_id query parameter");
        }

        var apiOrigin = (getQueryParam(search, "api_origin") || "").trim();
        var scriptUrl = "/pixel.js?site_id=" + encodeURIComponent(siteId);
        if (apiOrigin) {
          scriptUrl += "&api_origin=" + encodeURIComponent(apiOrigin);
        }
        if (status) {
          status.textContent = "Loading " + scriptUrl;
        }
        var script = document.createElement("script");
        script.defer = true;
        script.src = scriptUrl;
        script.onload = function() {
          if (status) {
            status.textContent = "Loaded " + scriptUrl;
          }
        };
        script.onerror = function() {
          if (status) {
            status.textContent = "Error loading " + scriptUrl;
          }
        };
        document.head.appendChild(script);
      })();
    </script>
  </body>
</html>
