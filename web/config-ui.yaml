# Browser-facing mpr-ui authentication configuration.
environments:
  - description: "Production"
    origins:
      - "https://loopaware.mprlab.com"
      - "https://tyemirov.github.io"
    auth:
      tauthUrl: "https://tauth-api.mprlab.com"
      googleClientId: "281540686395-b0ndglao5r6u6qih2etrtqudf6t0qbt0.apps.googleusercontent.com"
      tenantId: "loopaware"
      loginPath: "/auth/google"
      logoutPath: "/auth/logout"
