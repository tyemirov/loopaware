  <body>
    <main class="page">
      <h1>Subscribe Demo</h1>
      <p>
        Provide <code>site_id</code> and optional customization params in the query string.
      </p>
      <p id="subscribe-demo-status"></p>
      <div id="subscribe-demo"></div>
    </main>
    <script>
      // @ts-check
      (function () {
        function getQueryParam(search, name) {
          if (!search || !name) {
            return null;
          }
          var query = search.indexOf("?") === 0 ? search.substring(1) : search;
          if (!query) {
            return null;
          }
          var pairs = query.split("&");
          for (var i = 0; i < pairs.length; i++) {
            var rawPair = pairs[i];
            var separatorIndex = rawPair.indexOf("=");
            var rawKey = separatorIndex === -1 ? rawPair : rawPair.slice(0, separatorIndex);
            var rawValue = separatorIndex === -1 ? "" : rawPair.slice(separatorIndex + 1);
            var decodedKey = null;
            try {
              decodedKey = decodeURIComponent(rawKey.replace(/\+/g, " "));
            } catch (decodeError) {
              continue;
            }
            if (decodedKey === name) {
              try {
                return decodeURIComponent(rawValue.replace(/\+/g, " "));
              } catch (decodeError) {
                return rawValue.replace(/\+/g, " ");
              }
            }
          }
          return null;
        }
        var search = window.location.search || "";
        var siteId = getQueryParam(search, "site_id");
        if (!siteId) {
          throw new Error("subscribe_demo.init_failed: missing site_id query parameter");
        }
        siteId = siteId.trim();
        if (!siteId) {
          throw new Error("subscribe_demo.init_failed: empty site_id query parameter");
        }

        var status = document.getElementById("subscribe-demo-status");

        var allowed = ["mode", "accent", "cta", "success", "error", "name_field", "target", "api_origin"];
        var extraParts = [];
        for (var index = 0; index < allowed.length; index += 1) {
          var key = allowed[index];
          var value = (getQueryParam(search, key) || "").trim();
          if (value) {
            extraParts.push(encodeURIComponent(key) + "=" + encodeURIComponent(value));
          }
        }

        var scriptUrl = "/subscribe.js?site_id=" + encodeURIComponent(siteId);
        var extraEncoded = extraParts.join("&");
        if (extraEncoded) {
          scriptUrl += "&" + extraEncoded;
        }

        if (status) {
          status.textContent = "Loading " + scriptUrl;
        }
        var script = document.createElement("script");
        script.defer = true;
        script.src = scriptUrl;
        script.onload = function() {
          if (status) {
            status.textContent = "Loaded " + scriptUrl;
          }
        };
        script.onerror = function() {
          if (status) {
            status.textContent = "Error loading " + scriptUrl;
          }
        };
        document.head.appendChild(script);
      })();
    </script>
  </body>
