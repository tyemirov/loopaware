    <script>
(function() {
  var publicThemeStorageKey = 'loopaware_public_theme';
  var landingThemeStorageKey = 'loopaware_landing_theme';
  var legacyThemeStorageKey = 'landing_theme';
  var rootElement = document.body;
  var documentRoot = document.documentElement;
  var footerElement = document.querySelector('mpr-footer');
  function applyPublicTheme(theme) {
    var normalizedTheme = theme === 'light' ? 'light' : 'dark';
    rootElement.setAttribute('data-bs-theme', normalizedTheme);
    rootElement.setAttribute('data-mpr-theme', normalizedTheme);
    if (documentRoot) {
      documentRoot.setAttribute('data-bs-theme', normalizedTheme);
      documentRoot.setAttribute('data-mpr-theme', normalizedTheme);
    }
    rootElement.classList.toggle('bg-body', true);
    rootElement.classList.toggle('text-body', true);
  }
  function parseThemeConfig(rawValue) {
    if (!rawValue) {
      return {};
    }
    try {
      var parsed = JSON.parse(rawValue);
      if (parsed && typeof parsed === 'object') {
        return parsed;
      }
    } catch (error) {
      console.error(error);
    }
    return {};
  }
  function updateFooterThemeConfig(theme) {
    if (!footerElement) {
      return;
    }
    var normalizedTheme = theme === 'light' ? 'light' : 'dark';
    var config = parseThemeConfig(footerElement.getAttribute('theme-config'));
    if (!config.attribute) {
      config.attribute = 'data-bs-theme';
    }
    config.initialMode = normalizedTheme;
    footerElement.setAttribute('theme-config', JSON.stringify(config));
  }
  function loadPublicTheme() {
    var storedTheme = localStorage.getItem(publicThemeStorageKey);
    if (storedTheme === null) {
      var landingStoredTheme = localStorage.getItem(landingThemeStorageKey);
      if (landingStoredTheme === null) {
        var legacyStoredTheme = localStorage.getItem(legacyThemeStorageKey);
        if (legacyStoredTheme === 'light' || legacyStoredTheme === 'dark') {
          landingStoredTheme = legacyStoredTheme;
          localStorage.setItem(landingThemeStorageKey, landingStoredTheme);
        }
      }
      if (landingStoredTheme === 'light' || landingStoredTheme === 'dark') {
        storedTheme = landingStoredTheme;
        localStorage.setItem(publicThemeStorageKey, storedTheme);
      }
    }
    return storedTheme;
  }
  function persistPublicTheme(theme) {
    localStorage.setItem(publicThemeStorageKey, theme);
    localStorage.setItem(landingThemeStorageKey, theme);
  }
  function initializePublicTheme() {
    var storedTheme = loadPublicTheme();
    var normalizedTheme = storedTheme === 'light' || storedTheme === 'dark' ? storedTheme : 'dark';
    applyPublicTheme(normalizedTheme);
    updateFooterThemeConfig(normalizedTheme);
    if (storedTheme !== 'light' && storedTheme !== 'dark') {
      persistPublicTheme(normalizedTheme);
    }
  }
  if (footerElement) {
    footerElement.addEventListener('mpr-footer:theme-change', function(event) {
      var nextTheme = event && event.detail && event.detail.theme === 'dark' ? 'dark' : 'light';
      applyPublicTheme(nextTheme);
      persistPublicTheme(nextTheme);
    });
  }
  initializePublicTheme();
  var heroElement = document.querySelector('[data-public-hero]');
  if (heroElement) {
    var shouldScrollToTop = heroElement.getAttribute('data-scroll-to-top') === 'true';
    if (shouldScrollToTop) {
      heroElement.addEventListener('click', function(event) {
        event.preventDefault();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
    }
  }
})();
    </script>

    <script>
      (function() {
        var headingElement = document.getElementById('subscription-link-heading');
        var messageElement = document.getElementById('subscription-link-message');
        var openLink = document.getElementById('subscription-link-open');
        var secondaryLink = document.getElementById('subscription-link-secondary');
        var landingPath = '/login';
        var apiOrigin = '';
        try {
          apiOrigin = String(window.__LOOPAWARE_API_ORIGIN__ || '').trim();
        } catch (error) {}
        var actionEndpoint = apiOrigin ? (apiOrigin + '/public/subscriptions/confirm-link') : '/public/subscriptions/confirm-link';

        function setText(element, value) {
          if (!element) {
            return;
          }
          element.textContent = value || '';
        }

        function setHidden(element, hidden) {
          if (!element) {
            return;
          }
          if (hidden) {
            element.classList.add('d-none');
          } else {
            element.classList.remove('d-none');
          }
        }

        function normalizeURL(value) {
          if (typeof value !== 'string') {
            return '';
          }
          return value.trim();
        }

        function applyResponse(payload) {
          if (!payload || typeof payload !== 'object') {
            return;
          }
          if (typeof payload.heading === 'string' && payload.heading.trim()) {
            setText(headingElement, payload.heading.trim());
            document.title = payload.heading.trim() + ' — LoopAware';
          }
          if (typeof payload.message === 'string' && payload.message.trim()) {
            setText(messageElement, payload.message.trim());
          }

          var openUrl = normalizeURL(payload.open_url);
          if (openUrl) {
            if (openLink) {
              openLink.href = openUrl;
              openLink.textContent = normalizeURL(payload.open_label) || 'Open site';
            }
            setHidden(openLink, false);
          } else {
            setHidden(openLink, true);
          }

          var unsubscribeUrl = normalizeURL(payload.unsubscribe_url);
          if (unsubscribeUrl) {
            if (secondaryLink) {
              secondaryLink.href = unsubscribeUrl;
              secondaryLink.textContent = 'Unsubscribe';
              secondaryLink.classList.remove('btn-outline-secondary');
              secondaryLink.classList.add('btn-outline-danger');
            }
            return;
          }

          if (secondaryLink) {
            secondaryLink.href = landingPath || '/';
            secondaryLink.textContent = 'Return to LoopAware';
            secondaryLink.classList.remove('btn-outline-danger');
            if (!secondaryLink.classList.contains('btn-outline-secondary')) {
              secondaryLink.classList.add('btn-outline-secondary');
            }
          }
        }

        function getQueryParam(search, name) {
          if (!search || !name) {
            return null;
          }
          var query = search.indexOf("?") === 0 ? search.substring(1) : search;
          if (!query) {
            return null;
          }
          var pairs = query.split("&");
          for (var i = 0; i < pairs.length; i++) {
            var pair = pairs[i].split("=");
            if (decodeURIComponent(pair[0].replace(/\+/g, " ")) === name) {
              return decodeURIComponent((pair[1] || "").replace(/\+/g, " "));
            }
          }
          return null;
        }

        var search = (window.location && window.location.search) ? window.location.search : '';
        var token = getQueryParam(search, "token");
        if (!token) {
          applyResponse({ heading: 'Subscription confirmation', message: 'Missing confirmation token.' });
          return;
        }
        token = token.trim();
        if (!token) {
          applyResponse({ heading: 'Subscription confirmation', message: 'Missing confirmation token.' });
          return;
        }
        if (!actionEndpoint) {
          applyResponse({ heading: 'Subscription confirmation', message: 'Subscription confirmation is unavailable.' });
          return;
        }

        fetch(actionEndpoint + '?token=' + encodeURIComponent(token), {
          method: 'GET',
          credentials: 'same-origin',
          headers: { 'Accept': 'application/json' },
          referrer: window.location.href,
          referrerPolicy: 'strict-origin-when-cross-origin'
        }).then(function(response) {
          return response.json().catch(function() {
            return {};
          }).then(function(payload) {
            if (!response.ok) {
              return Object.assign({ heading: 'Subscription confirmation', message: 'Request failed.' }, payload || {});
            }
            return payload || {};
          });
        }).then(applyResponse).catch(function() {
          applyResponse({ heading: 'Subscription confirmation', message: 'Request failed.' });
        });
      }());
    </script>
