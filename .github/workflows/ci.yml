name: Go CI

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/**'
      - '.mprlab/deploy/**'
      - '**/*.go'
      - 'clients/**'
      - 'docker-compose*.yml'
      - 'configs/**'
      - 'mobile/**'
      - 'scripts/**'
      - 'tests/**'
      - 'web/**'
      - 'Makefile'
      - 'go.mod'
      - 'go.sum'
  pull_request:
    branches:
      - master
    paths:
      - '.github/workflows/**'
      - '.mprlab/deploy/**'
      - '**/*.go'
      - 'clients/**'
      - 'docker-compose*.yml'
      - 'configs/**'
      - 'mobile/**'
      - 'scripts/**'
      - 'tests/**'
      - 'web/**'
      - 'Makefile'
      - 'go.mod'
      - 'go.sum'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LOOPAWARE_PLAYWRIGHT_CHANNEL: chrome
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      PYTHON_VERSION: '3.11'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            tests/package-lock.json
            clients/react-native/package-lock.json
            mobile/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install test dependencies
        run: |
          npm --prefix tests ci
          google-chrome --version

      - name: Make CI
        run: make ci
