name: Go CI

on:
  push:
    branches:
      - master
    paths:
      - '.github/**'
      - '.mprlab/deploy/**'
      - '**/*.go'
      - 'clients/**'
      - 'Dockerfile'
      - 'docker-compose*.yml'
      - 'configs/**'
      - 'mobile/**'
      - 'scripts/**'
      - 'tests/**'
      - 'web/**'
      - 'Makefile'
      - 'go.mod'
      - 'go.sum'
  pull_request:
    branches:
      - master

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GOCACHE: ${{ github.workspace }}/.cache/go-build
  NPM_CONFIG_CACHE: ${{ github.workspace }}/.cache/npm

jobs:
  checks:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Static checks
            target: ci-checks
            node: true
            go: true
          - name: Backend tests
            target: ci-backend
            go: true
          - name: Mobile checks
            target: ci-mobile
            node: true
          - name: Integration 1/3
            target: ci-integration
            node: true
            go: true
            shard: 1/3
          - name: Integration 2/3
            target: ci-integration
            node: true
            go: true
            shard: 2/3
          - name: Integration 3/3
            target: ci-integration
            node: true
            go: true
            shard: 3/3
    env:
      LOOPAWARE_PLAYWRIGHT_CHANNEL: chrome
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      LOOPAWARE_TEST_SHARD: ${{ matrix.shard }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        if: matrix.go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Set up Node
        if: matrix.node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            tests/package-lock.json
            clients/react-native/package-lock.json
            mobile/package-lock.json
            mobile/prepared/package-lock.json

      - name: Set up Python
        if: matrix.target == 'ci-checks' || matrix.target == 'ci-integration'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Set up Java
        if: matrix.target == 'ci-mobile'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            mobile/prepared/package-lock.json
            mobile/prepared/android/**/*.gradle
            mobile/prepared/android/gradle.properties
            mobile/prepared/android/gradle/wrapper/gradle-wrapper.properties

      - name: Check browser
        if: matrix.target == 'ci-integration'
        run: google-chrome --version

      - name: Run checks
        run: make ${{ matrix.target }}

  test:
    if: always()
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - name: Require all checks
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
        run: test "$CHECKS_RESULT" = success
