name: Go CI

on:
  push:
    branches:
      - master
    paths:
      - '.github/**'
      - '.mprlab/deploy/**'
      - '**/*.go'
      - 'clients/**'
      - 'Dockerfile'
      - 'docker-compose*.yml'
      - 'configs/**'
      - 'mobile/**'
      - 'scripts/**'
      - 'tests/**'
      - 'web/**'
      - 'Makefile'
      - 'go.mod'
      - 'go.sum'
  pull_request:
    branches:
      - master
    paths:
      - '.github/**'
      - '.mprlab/deploy/**'
      - '**/*.go'
      - 'clients/**'
      - 'Dockerfile'
      - 'docker-compose*.yml'
      - 'configs/**'
      - 'mobile/**'
      - 'scripts/**'
      - 'tests/**'
      - 'web/**'
      - 'Makefile'
      - 'go.mod'
      - 'go.sum'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LOOPAWARE_PLAYWRIGHT_CHANNEL: chrome
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      PYTHON_VERSION: '3.11'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            tests/package-lock.json
            clients/react-native/package-lock.json
            mobile/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install test dependencies
        run: |
          npm --prefix tests ci
          google-chrome --version

      - name: Make CI
        run: make ci
