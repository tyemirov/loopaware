name: Go CI

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/**'
      - '**/*.go'
      - 'docker-compose*.yml'
      - 'configs/**'
      - 'tests/**'
      - 'web/**'
      - 'Makefile'
      - 'go.mod'
      - 'go.sum'
  pull_request:
    branches:
      - master
    paths:
      - '.github/workflows/**'
      - '**/*.go'
      - 'docker-compose*.yml'
      - 'configs/**'
      - 'tests/**'
      - 'web/**'
      - 'Makefile'
      - 'go.mod'
      - 'go.sum'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: tests/package.json

      - name: Install test dependencies
        run: |
          npm --prefix tests ci
          npm --prefix tests run install:browsers

      - name: Make CI
        run: make ci
