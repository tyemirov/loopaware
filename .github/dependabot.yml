version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
    groups:
      go-dependencies:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /tests
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
    groups:
      test-dependencies:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /clients/react-native
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
    groups:
      react-native-client-dependencies:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /mobile
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
    groups:
      mobile-dependencies:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
    groups:
      container-bases:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
    groups:
      workflow-actions:
        patterns:
          - "*"
