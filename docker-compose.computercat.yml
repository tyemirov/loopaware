services:
  la-tauth:
    image: ghcr.io/tyemirov/tauth:latest
    container_name: la-tauth
    restart: unless-stopped
    pull_policy: always
    env_file:
      - ./configs/.env.tauth.computercat
    x-config-audit-env-file: ./tests/configs/tauth.env
    expose:
      - "8082"
    volumes:
      - tauth-data:/data
      - ./configs/config.tauth.yml:/config/config.yml:ro

  la-pinguin:
    container_name: la-pinguin
    depends_on:
      - la-tauth
    image: ghcr.io/tyemirov/pinguin:latest
    restart: unless-stopped
    pull_policy: always
    env_file:
      - ./configs/.env.pinguin.computercat
    x-config-audit-env-file: ./tests/configs/pinguin.env
    expose:
      - "8081"
    volumes:
      - pinguin-data:/app/data
      - ./configs/config.pinguin.yml:/config/config.yml:ro

  loopaware-api:
    healthcheck:
      test: ["CMD", "wget", "-O-", "http://localhost:8080/healthz"]
      start_interval: 1s
      interval: 30s
      start_period: 30s
      timeout: 2s
      retries: 6
    build:
      context: .
    image: ghcr.io/tyemirov/loopaware:latest
    container_name: loopaware-api
    restart: unless-stopped
    pull_policy: build
    env_file:
      - ./configs/.env.loopaware.computercat
    x-config-audit-env-file: ./tests/configs/loopaware.env
    depends_on:
      la-pinguin:
        condition: service_started
      la-tauth:
        condition: service_started
    expose:
      - "8080"
    volumes:
      - loopaware-data:/app/data
      - ./configs/config.loopaware.yml:/app/configs/config.loopaware.yml:ro

  loopaware-proxy:
    image: ghcr.io/tyemirov/ghttp:latest
    container_name: loopaware-proxy
    pull_policy: always
    command:
      - --response-header
      - "/healthz=Cache-Control:no-store"
      - --response-header
      - "/=Content-Security-Policy:default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://loopaware.mprlab.com https://accounts.google.com https://www.googletagmanager.com; script-src-attr 'none'; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://accounts.google.com https://fonts.googleapis.com; font-src 'self' data: https://cdn.jsdelivr.net https://fonts.gstatic.com; img-src 'self' data: blob: https://cdn.jsdelivr.net https://loopaware.mprlab.com https://loopaware-api.mprlab.com https://accounts.google.com https://*.googleusercontent.com https://*.google-analytics.com https://*.googletagmanager.com https://*.doubleclick.net; connect-src 'self' https://cdn.jsdelivr.net http://localhost:* http://127.0.0.1:* https://loopaware-api.mprlab.com https://tauth-api.mprlab.com https://accounts.google.com https://www.google.com https://*.google-analytics.com https://*.googletagmanager.com https://*.doubleclick.net; frame-src https://accounts.google.com; worker-src 'self' blob:; manifest-src 'self'; form-action 'self'; frame-ancestors 'none'"
      - --response-header
      - "/=Permissions-Policy:accelerometer=(), autoplay=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()"
      - --response-header
      - "/=Cross-Origin-Opener-Policy:same-origin-allow-popups"
      - --response-header
      - "/=Referrer-Policy:strict-origin-when-cross-origin"
      - --response-header
      - "/=Strict-Transport-Security:max-age=31536000; includeSubDomains"
      - --response-header
      - "/=X-Content-Type-Options:nosniff"
      - --response-header
      - "/=X-Frame-Options:DENY"
      - --response-header
      - "/=X-Permitted-Cross-Domain-Policies:none"
    depends_on:
      - loopaware-api
      - la-tauth
    ports:
      - "4443:4443"
    env_file:
      - ./configs/.env.ghttp.computercat
    x-config-audit-env-file: ./tests/configs/ghttp.env
    volumes:
      - ./web:/data:ro
      - /media/share/Drive/exchange/certs/computercat/computercat-cert.pem:/certs/computercat-cert.pem:ro
      - /media/share/Drive/exchange/certs/computercat/computercat-key.pem:/certs/computercat-key.pem:ro
    networks:
      default:
        ipv4_address: 172.30.241.10
    restart: unless-stopped

volumes:
  loopaware-data:
  pinguin-data:
  tauth-data:

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.241.0/24
