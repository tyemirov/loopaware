services:
  la-tauth:
    image: ghcr.io/tyemirov/tauth:latest
    platform: ${LOOPAWARE_TEST_IMAGE_PLATFORM:-linux/amd64}
    restart: unless-stopped
    pull_policy: always
    env_file:
      - ./configs/tauth.env
    expose:
      - "8082"
    volumes:
      - tauth-data:/data
      - ../configs/config.tauth.yml:/config/config.yml:ro

  la-pinguin:
    image: ghcr.io/tyemirov/pinguin:latest
    platform: ${LOOPAWARE_TEST_IMAGE_PLATFORM:-linux/amd64}
    restart: unless-stopped
    pull_policy: always
    env_file:
      - ./configs/pinguin.env
    depends_on:
      - la-tauth
    expose:
      - "8081"
    volumes:
      - pinguin-data:/app/data
      - ../configs/config.pinguin.yml:/config/config.yml:ro

  loopaware-api:
    build:
      context: ..
    pull_policy: build
    env_file:
      - ./configs/loopaware.env
    depends_on:
      la-pinguin:
        condition: service_started
      la-tauth:
        condition: service_started
    expose:
      - "8080"
    volumes:
      - loopaware-data:/app/data
      - ../configs/config.loopaware.yml:/app/configs/config.loopaware.yml:ro

  loopaware-proxy:
    image: ghcr.io/tyemirov/ghttp:latest
    platform: ${LOOPAWARE_TEST_IMAGE_PLATFORM:-linux/amd64}
    pull_policy: always
    command:
      - --response-header
      - "/=Permissions-Policy:accelerometer=(), autoplay=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()"
      - --response-header
      - "/=Referrer-Policy:strict-origin-when-cross-origin"
      - --response-header
      - "/=X-Content-Type-Options:nosniff"
      - --response-header
      - "/=X-Frame-Options:DENY"
      - --response-header
      - "/=X-Permitted-Cross-Domain-Policies:none"
    depends_on:
      - loopaware-api
      - la-tauth
    env_file:
      - ./configs/ghttp.env
    volumes:
      - ../web:/data:ro
    ports:
      - "8090:8090"
    restart: unless-stopped

volumes:
  loopaware-data:
  pinguin-data:
  tauth-data:
