services:
  la-tauth:
    image: ghcr.io/tyemirov/tauth:latest
    platform: ${LOOPAWARE_TEST_IMAGE_PLATFORM:-linux/amd64}
    restart: unless-stopped
    pull_policy: always
    env_file:
      - ./configs/tauth.env
    expose:
      - "8082"
    volumes:
      - tauth-data:/data
      - ../configs/config.tauth.yml:/config/config.yml:ro

  la-pinguin:
    image: ghcr.io/tyemirov/pinguin:latest
    platform: ${LOOPAWARE_TEST_IMAGE_PLATFORM:-linux/amd64}
    restart: unless-stopped
    pull_policy: always
    env_file:
      - ./configs/pinguin.env
    depends_on:
      - la-tauth
    expose:
      - "8081"
    volumes:
      - pinguin-data:/app/data
      - ../configs/config.pinguin.yml:/config/config.yml:ro

  loopaware-api:
    healthcheck:
      test: ["CMD", "wget", "-O-", "http://localhost:8080/healthz"]
      start_interval: 1s
      interval: 30s
      start_period: 30s
      timeout: 2s
      retries: 6
    build:
      context: ..
    pull_policy: build
    env_file:
      - ./configs/loopaware.env
    depends_on:
      la-pinguin:
        condition: service_started
      la-tauth:
        condition: service_started
    expose:
      - "8080"
    ports:
      - "127.0.0.1:0:8080"
    volumes:
      - loopaware-data:/app/data
      - ./configs/config.loopaware.yml:/app/configs/config.loopaware.yml:ro

  loopaware-proxy:
    image: ghcr.io/tyemirov/ghttp:latest
    platform: ${LOOPAWARE_TEST_IMAGE_PLATFORM:-linux/amd64}
    pull_policy: always
    command:
      - --response-header
      - "/healthz=Cache-Control:no-store"
      - --response-header
      - "/=Content-Security-Policy:default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://loopaware.mprlab.com https://accounts.google.com https://www.googletagmanager.com; script-src-attr 'none'; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://accounts.google.com https://fonts.googleapis.com; font-src 'self' data: https://cdn.jsdelivr.net https://fonts.gstatic.com; img-src 'self' data: blob: https://cdn.jsdelivr.net https://loopaware.mprlab.com https://loopaware-api.mprlab.com https://accounts.google.com https://*.googleusercontent.com https://*.google-analytics.com https://*.googletagmanager.com https://*.doubleclick.net; connect-src 'self' https://cdn.jsdelivr.net http://localhost:* http://127.0.0.1:* https://loopaware-api.mprlab.com https://tauth-api.mprlab.com https://accounts.google.com https://www.google.com https://*.google-analytics.com https://*.googletagmanager.com https://*.doubleclick.net; frame-src https://accounts.google.com; worker-src 'self' blob:; manifest-src 'self'; form-action 'self'; frame-ancestors 'none'"
      - --response-header
      - "/=Permissions-Policy:accelerometer=(), autoplay=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()"
      - --response-header
      - "/=Cross-Origin-Opener-Policy:same-origin-allow-popups"
      - --response-header
      - "/=Referrer-Policy:strict-origin-when-cross-origin"
      - --response-header
      - "/=X-Content-Type-Options:nosniff"
      - --response-header
      - "/=X-Frame-Options:DENY"
      - --response-header
      - "/=X-Permitted-Cross-Domain-Policies:none"
    depends_on:
      - loopaware-api
      - la-tauth
    env_file:
      - ./configs/ghttp.env
    volumes:
      - ../web:/data:ro
    ports:
      - "8090:8090"
    networks:
      default:
        ipv4_address: 172.30.242.10
    restart: unless-stopped

volumes:
  loopaware-data:
  pinguin-data:
  tauth-data:

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.242.0/24
